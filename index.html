<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사랑해 하트</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; }
  #cap { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #ff6b6b; font: 18px sans-serif; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="20개 언어의 '사랑해'로 만든 빨간 하트, 가운데에 '은혜야 사랑해'"></canvas>
<div id="cap" aria-live="polite"></div>
<script>
const LOVE = [
  ["한국어", "사랑해"], ["English", "I love you"], ["日本語", "愛してる"], ["中文", "我爱你"],
  ["Français", "Je t'aime"], ["Español", "Te quiero"], ["Deutsch", "Ich liebe dich"], ["Italiano", "Ti amo"],
  ["Português", "Eu te amo"], ["Русский", "Я тебя люблю"], ["Nederlands", "Ik hou van jou"], ["Svenska", "Jag älskar dig"],
  ["Türkçe", "Seni seviyorum"], ["Ελληνικά", "Σ' αγαπώ"], ["Tiếng Việt", "Anh yêu em"], ["ไทย", "ฉันรักเธอ"],
  ["Bahasa Indonesia", "Aku cinta kamu"], ["Polski", "Kocham cię"], ["한국어", "  사랑해"], ["Suomi", "Minä rakastan sinua"],
];
const MESSAGE = ["insert your message here"];              // lines typed inside the center box
const HOLE = { x0: -0.6, x1: 0.6, y0: -0.2, y1: 0.55 }; // center box, in heart coordinates
const SPEED_MS = 60;

// Split into graphemes so Thai/Hindi vowel marks stay attached to their letter.
const seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter() : null;
const graphemes = t => seg ? [...seg.segment(t)].map(s => s.segment) : Array.from(t);

// Stream of {ch, lang, sep}: each phrase without spaces, then a ♥ separator.
const stream = [];
LOVE.forEach(([lang, text], li) => {
  graphemes(text).filter(g => g.trim()).forEach(ch => stream.push({ ch, li }));
  stream.push({ ch: "♥", li, sep: true });
});

const inHeart = (x, y) => { const a = x * x + y * y - 1; return a * a * a - x * x * y * y * y <= 0; };
const inHole = (x, y) => x > HOLE.x0 && x < HOLE.x1 && y > HOLE.y0 && y < HOLE.y1;

const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), cap = document.getElementById("cap");
let cells = [], size = 0, shown = 0, hole = null, msg = [], msgFont = "";
const heartTotal = () => Math.max(stream.length, cells.length);

// Pick the largest grid cell size whose in-heart cell count (minus the center box) still fits every character.
function layout() {
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const box = Math.min(W, H - 44) * 0.98, left = (W - box) / 2, top = (H - 44 - box) / 2 + 4;
  for (size = Math.floor(box / 8); size >= 6; size--) {
    cells = [];
    let hx0 = Infinity, hy0 = Infinity, hx1 = -Infinity, hy1 = -Infinity;
    const n = Math.floor(box / size);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const x = ((c + 0.5) / n) * 2.4 - 1.2, y = 1.25 - ((r + 0.5) / n) * 2.4;
      const px = left + (c + 0.5) * size, py = top + (r + 0.5) * size;
      if (inHole(x, y)) {
        hx0 = Math.min(hx0, px); hx1 = Math.max(hx1, px); hy0 = Math.min(hy0, py); hy1 = Math.max(hy1, py);
      } else if (inHeart(x, y)) cells.push([px, py]);
    }
    hole = { x: hx0 - size / 2, y: hy0 - size / 2, w: hx1 - hx0 + size, h: hy1 - hy0 + size };
    if (cells.length >= stream.length) break;
  }
  console.assert(cells.length >= stream.length, "heart grid too small for text");

  // Lay out the message: centered lines, font sized to fit the box.
  const lines = MESSAGE.map(graphemes), longest = Math.max(...lines.map(l => l.length));
  const fs = Math.floor(Math.min(hole.h / (lines.length * 1.3), hole.w * 0.9 / longest));
  msgFont = `bold ${fs}px sans-serif`;
  ctx.font = msgFont;
  msg = [];
  lines.forEach((line, li) => {
    const widths = line.map(ch => ctx.measureText(ch).width);
    let x = hole.x + (hole.w - widths.reduce((a, b) => a + b, 0)) / 2;
    const y = hole.y + hole.h / 2 + (li - (lines.length - 1) / 2) * fs * 1.3;
    line.forEach((ch, i) => { msg.push({ ch, x: x + widths[i] / 2, y }); x += widths[i]; });
  });

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.clearRect(0, 0, W, H);
  ctx.shadowColor = "rgba(255,0,40,.8)"; ctx.shadowBlur = size * 0.4;
  for (let i = 0; i < shown; i++) drawStep(i);
}

function drawStep(i) {
  if (i < heartTotal()) {
    const cell = cells[i];
    if (!cell) return;
    const s = stream[i] || { ch: "♥", sep: true }; // leftover cells finish the heart's tip
    ctx.font = `bold ${Math.floor(size * 0.9)}px sans-serif`;
    ctx.fillStyle = s.sep ? "#ff9aa8" : "#ff1e3c";
    ctx.fillText(s.ch, cell[0], cell[1]);
  } else {
    const m = msg[i - heartTotal()];
    if (i === heartTotal()) { // heart is full: draw the box before the first message character
      ctx.strokeStyle = "#ff1e3c"; ctx.lineWidth = 2;
      ctx.strokeRect(hole.x + size * 0.15, hole.y + size * 0.15, hole.w - size * 0.3, hole.h - size * 0.3);
    }
    ctx.font = msgFont;
    ctx.fillStyle = "#ff1e3c";
    ctx.fillText(m.ch, m.x, m.y);
  }
}

function tick() {
  if (shown >= heartTotal() + msg.length) return;
  drawStep(shown);
  if (stream[shown]) {
    const [lang, text] = LOVE[stream[shown].li];
    cap.textContent = `${lang} — ${text}`;
  } else if (shown >= heartTotal()) cap.textContent = MESSAGE.join(" ");
  shown++;
  setTimeout(tick, shown > heartTotal() ? SPEED_MS * 4 : SPEED_MS); // message types slower
}

addEventListener("resize", layout);
layout();
tick();
</script>
</body>
</html>
